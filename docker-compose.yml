services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: smart-waste-classification:latest

    container_name: smart-waste-api

    command:
      - python
      - -m
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "8000:8000"

    environment:
      MODEL_PATH: /app/models/final_waste_classifier.pt
      LOG_LEVEL: INFO

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8000/health

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


  frontend:
    image: smart-waste-classification:latest

    container_name: smart-waste-frontend

    command:
      - python
      - -m
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true

    ports:
      - "8501:8501"

    environment:
      API_BASE_URL: http://api:8000

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped
    